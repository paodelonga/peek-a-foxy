[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peek-a-foxy"
version = "0.2.0"
description = "Peek-a-boo for Foxys: autohide the tab bar and navigation bar per window. They hide, they peek, then BOOO! out when you hover."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "paodelonga" }]
keywords = ["firefox", "userchrome", "autohide", "tabs", "urlbar", "fx-autoconfig", "peek-a-boo"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = [
  # The floors are the oldest Typer and Rich that pass the whole suite (the "lowest" job of ci.yml
  # runs them; their own dependencies are not lowered). Typer is below 1.0 and the code reaches
  # into TyperGroup and TyperCommand, so a new minor release can break it: the ceiling moves up
  # when a release has been tried.
  "typer>=0.16.0,<0.30",
  "rich>=13.8,<16",
]

[project.optional-dependencies]
dev = [
  "commitizen>=4",
  "hypothesis>=6",
  "mypy>=1.10",
  "marionette-driver>=3",
  "pytest>=8",
  "pre-commit>=4",
  "pytest-cov>=5",
  "pyyaml>=6",  # tests/test_workflows.py reads the workflow files; without it the file is skipped
  "ruff>=0.6",
]

[project.scripts]
peek-a-foxy = "peek_a_foxy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/peek_a_foxy"]

# The Firefox files live in chrome/ so the repository reads like a profile; ship them inside the package.
[tool.hatch.build.targets.wheel.force-include]
"chrome" = "peek_a_foxy/assets"

[tool.hatch.build.targets.sdist]
include = ["src", "chrome", "tests", "README.md", "README.pt-BR.md", "CONTRIBUTING.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked "network" clone the real fx-autoconfig; run them with `pytest -m network`.
addopts = "-m 'not network and not browser'"
markers = [
  "network: needs internet access (clones the real fx-autoconfig repository)",
  "browser: drives a real headless Firefox (needs network too); see tests/browser/conftest.py",
]

[tool.coverage.run]
source = ["peek_a_foxy"]
branch = true

# Used to check commit messages, to pick the next version from them, and to create the release commit
# and tag (`cz bump`). The changelog is written by hand (Keep a Changelog), so it is not generated.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true  # before 1.0, a breaking change bumps the minor version
bump_message = "chore(release): $new_version"
annotated_tag = true

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
