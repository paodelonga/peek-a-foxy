# Optional on your machine (see CONTRIBUTING.md); the same checks run in CI, which is what counts.
#   pip install -e ".[dev]" && pre-commit install
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # fx-autoconfig/ holds upstream's files byte for byte (their SHA-256 are pinned), so these two
      # hooks must not "fix" them.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^fx-autoconfig/
      - id: end-of-file-fixer
        exclude: ^fx-autoconfig/
      - id: check-yaml
        # Templates: placeholders such as @VERSION@ make them YAML only once render_manifests.py
        # has filled them in, and tests/test_packaging.py parses the filled-in files.
        exclude: ^packaging/templates/
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: f690817de25831a37094ca35af5ada05c909ff1c  # frozen: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
