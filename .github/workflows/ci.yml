name: CI

on:
  push:
    branches: [main, devel/devel]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov --cov-fail-under=90

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy

  # Clones the real fx-autoconfig at the pinned commit; guards against upstream rewriting history.
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test against the real fx-autoconfig
        run: python -m pytest -m network

  # Drives a real headless Firefox (needs network: it loads the real fx-autoconfig).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test in Firefox
        env:
          PEEK_A_FOXY_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python -m pytest -m browser

  # Every commit message of a pull request must follow Conventional Commits (merge commits are allowed).
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "commitizen>=4"
      - name: Check the commit messages
        run: >-
          cz check --rev-range
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # The same hooks developers can run locally with `pre-commit install`.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "pre-commit>=4"
      - name: Run the hooks
        run: pre-commit run --all-files --show-diff-on-failure
