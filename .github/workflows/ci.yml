name: CI

on:
  push:
    branches: [main, devel/devel]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request makes the run for the older one pointless: stop it. Runs for
# pushes to main and devel/devel are never cancelled, so every commit there keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov --cov-fail-under=90
      # A report from every machine type on every run. A runner may have no Firefox, so doctor
      # exiting with 1 must not fail the job; the file is what matters.
      - name: Diagnostic report
        continue-on-error: true
        run: python -m peek_a_foxy doctor --json --save doctor.json
      - name: Upload the diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doctor-${{ matrix.os }}-py${{ matrix.python }}
          path: doctor.json
          if-no-files-found: ignore
          retention-days: 30

  # The oldest Typer and Rich that pyproject.toml allows must still work: the lower bounds there are
  # a promise to people whose environment already has an older release. Only these two are lowered,
  # and the whole suite runs against them. What they depend on themselves (click, markdown-it-py,
  # pygments...) stays at the newest release that pip picks, which the bounds say nothing about;
  # `pip check` shows that the pair and those dependencies agree with each other.
  lowest:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"
      - name: Install, then go down to the lowest allowed Typer and Rich
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "typer==0.16.0" "rich==13.8.0"
      - name: Show the versions in use, and that they fit together
        run: |
          python -m pip list
          python -m pip check
      - name: Test
        run: python -m pytest

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy

  # Clones the real fx-autoconfig at the pinned commit; guards against upstream rewriting history.
  network:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test against the real fx-autoconfig
        run: python -m pytest -m network

  # Drives a real headless Firefox (needs network: it loads the real fx-autoconfig).
  browser:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        id: firefox
        with:
          firefox-version: latest
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test in Firefox
        env:
          PEEK_A_FOXY_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python -m pytest -m browser

  # Every commit message of a pull request must follow Conventional Commits (merge commits are allowed).
  commit-messages:
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "commitizen==4.19.3"
      - name: Check the commit messages
        run: >-
          cz check --rev-range
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # The same hooks developers can run locally with `pre-commit install`.
  pre-commit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "pre-commit==4.7.0"
      - name: Run the hooks
        run: pre-commit run --all-files --show-diff-on-failure
