name: Firefox weekly

# The browser tests drive a real Firefox, and Firefox changes the chrome (its own UI) without notice.
# Running them every week against the current release, the Beta and the ESR tells us about a
# breaking change before users hit it; a red run here means the script or the CSS needs attention.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: browser (${{ matrix.os }}, Firefox ${{ matrix.firefox }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        firefox: [latest, latest-beta, latest-esr]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        id: firefox
        with:
          firefox-version: ${{ matrix.firefox }}
      - name: Show the Firefox version
        shell: bash
        run: '"${{ steps.firefox.outputs.firefox-path }}" --version'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test in Firefox
        env:
          PEEK_A_FOXY_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python -m pytest -m browser
