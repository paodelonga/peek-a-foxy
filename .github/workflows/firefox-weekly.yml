name: Firefox weekly

# The browser tests drive a real Firefox, and Firefox changes the chrome (its own UI) without notice.
# Running them every week against the current release and the Beta tells us about a breaking change
# before users hit it; a red run here means the script or the CSS needs attention.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: browser (${{ matrix.os }}, Firefox ${{ matrix.firefox }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        firefox: [latest, latest-beta]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: ${{ matrix.firefox }}
      - name: Show the Firefox version
        shell: bash
        run: '"${{ steps.firefox.outputs.firefox-path }}" --version'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test in Firefox
        env:
          PEEK_A_FOXY_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python -m pytest -m browser
